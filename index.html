
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClientFlow - Sign In</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        /* =========================
           GLOBAL
        ========================= */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;

            background:#0f1113;

            color:#f5f5f5;

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:30px;
        }


        /* =========================
           LOGIN CONTAINER
        ========================= */

        .login-container{
            width:100%;
            max-width:430px;
        }


        /* =========================
           LOGO
        ========================= */

        .login-logo{
            text-align:center;

            margin-bottom:28px;
        }

        .login-logo h1{
            font-size:28px;

            color:#ff7a00;

            margin-bottom:7px;
        }

        .login-logo p{
            color:#777d84;

            font-size:13px;
        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-card{
            background:#171a1d;

            border:1px solid #292d32;

            border-radius:18px;

            padding:32px;

            box-shadow:0 20px 60px rgba(0,0,0,.35);

            transition:.2s ease;
        }

        .login-card:hover{
            border-color:#353a40;
        }


        /* =========================
           CARD HEADING
        ========================= */

        .login-heading{
            margin-bottom:25px;
        }

        .login-heading h2{
            font-size:21px;

            color:#fff;

            margin-bottom:7px;
        }

        .login-heading p{
            color:#858b92;

            font-size:13px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group{
            display:flex;

            flex-direction:column;

            margin-bottom:18px;
        }

        .form-group label{
            font-size:12px;

            color:#aaa;

            margin-bottom:7px;

            font-weight:600;
        }


        /* =========================
           INPUT
        ========================= */

        .input-wrapper{
            position:relative;

            display:flex;

            align-items:center;
        }

        .input-wrapper > i{
            position:absolute;

            left:13px;

            color:#777d84;

            font-size:15px;

            pointer-events:none;
        }

        .input-wrapper input{
            width:100%;

            padding:12px 42px 12px 39px;

            background:#111315;

            border:1px solid #30343a;

            border-radius:8px;

            outline:none;

            color:#fff;

            font-size:13px;

            transition:.2s ease;
        }

        .input-wrapper input::placeholder{
            color:#666c73;
        }

        .input-wrapper input:focus{
            border-color:#ff7a00;

            box-shadow:
                0 0 0 3px rgba(255,122,0,.1),
                0 0 10px rgba(255,122,0,.12);
        }


        /* =========================
           PASSWORD TOGGLE
        ========================= */

        .password-toggle{
            position:absolute;

            right:11px;

            background:none;

            border:none;

            color:#777d84;

            font-size:16px;

            cursor:pointer;

            display:flex;

            align-items:center;

            transition:.2s ease;
        }

        .password-toggle:hover{
            color:#ff7a00;
        }


        /* =========================
           REMEMBER + FORGOT
        ========================= */

        .login-options{
            display:flex;

            justify-content:space-between;

            align-items:center;

            margin:4px 0 22px;
        }

        .remember{
            display:flex;

            align-items:center;

            gap:7px;

            color:#858b92;

            font-size:12px;

            cursor:pointer;
        }

        .remember input{
            appearance:none;

            width:16px;
            height:16px;

            background:#111315;

            border:1px solid #363a40;

            border-radius:4px;

            cursor:pointer;

            position:relative;
        }

        .remember input:checked{
            background:#ff7a00;

            border-color:#ff7a00;
        }

        .remember input:checked::after{
            content:"✓";

            position:absolute;

            color:#111;

            font-size:11px;

            font-weight:bold;

            left:3px;
            top:0px;
        }

        .forgot-link{
            color:#ff7a00;

            text-decoration:none;

            font-size:12px;
        }

        .forgot-link:hover{
            color:#ff8c1a;

            text-decoration:underline;
        }


        /* =========================
           SIGN IN BUTTON
        ========================= */

        .signin-btn{
            width:100%;

            padding:12px;

            border:none;

            border-radius:8px;

            background:#ff7a00;

            color:#111;

            font-size:14px;

            font-weight:bold;

            cursor:pointer;

            transition:.2s ease;

            box-shadow:0 5px 18px rgba(255,122,0,.2);
        }

        .signin-btn:hover{
            background:#ff8c1a;

            transform:translateY(-1px);

            box-shadow:0 8px 22px rgba(255,122,0,.28);
        }

        .signin-btn:active{
            transform:scale(.98);
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .login-message{
            display:none;

            padding:11px 13px;

            margin-bottom:16px;

            border-radius:8px;

            background:#351b1b;

            border:1px solid #4a2525;

            color:#ff7373;

            font-size:12px;

            line-height:1.5;
        }

        .login-message.show{
            display:block;
        }


        /* =========================
           DEMO INFO
        ========================= */

        .demo-info{
            margin-top:20px;

            padding:12px;

            background:#111315;

            border:1px solid #292d32;

            border-radius:8px;

            text-align:center;

            color:#70757c;

            font-size:11px;

            line-height:1.6;
        }

        .demo-info strong{
            color:#92969c;
        }


        /* =========================
           FOOTER
        ========================= */

        .login-footer{
            text-align:center;

            margin-top:22px;

            color:#555b61;

            font-size:11px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:500px){

            body{
                padding:20px;
            }

            .login-card{
                padding:25px 22px;
            }

            .login-logo h1{
                font-size:25px;
            }

        }

        /* =========================
   PROFILE DROPDOWN
========================= */

.profile-wrapper{
    position:relative;
}


/* Profile Button */

.profile{
    border:none;
    background:none;

    display:flex;
    align-items:center;
    gap:9px;

    color:#ddd;

    cursor:pointer;

    font-size:14px;

    padding:6px 8px;

    border-radius:9px;

    transition:.2s ease;
}

.profile:hover{
    background:#1a1d20;
}

.profile i:first-child{
    font-size:30px;
    color:#ff7a00;
}


/* Arrow */

.profile-arrow{
    font-size:11px !important;

    color:#777d84 !important;

    transition:.2s ease;
}


/* Rotate arrow */

.profile-wrapper.open .profile-arrow{
    transform:rotate(180deg);
}


/* =========================
   PROFILE MENU
========================= */

.profile-menu{

    position:absolute;

    top:52px;
    right:0;

    width:235px;

    background:#171a1d;

    border:1px solid #292d32;

    border-radius:13px;

    padding:10px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.45);

    opacity:0;

    visibility:hidden;

    transform:translateY(-8px);

    transition:.2s ease;

    z-index:2000;
}


/* Open */

.profile-wrapper.open .profile-menu{

    opacity:1;

    visibility:visible;

    transform:translateY(0);
}


/* =========================
   MENU HEADER
========================= */

.profile-menu-header{

    display:flex;

    align-items:center;

    gap:11px;

    padding:10px;

}

.profile-menu-header > i{

    font-size:35px;

    color:#ff7a00;
}

.profile-menu-header strong{

    display:block;

    color:#fff;

    font-size:13px;

    margin-bottom:3px;
}

.profile-menu-header small{

    display:block;

    color:#777d84;

    font-size:10px;
}


/* Divider */

.profile-divider{

    height:1px;

    background:#292d32;

    margin:6px 0;
}


/* =========================
   MENU LINKS
========================= */

.profile-menu a{

    display:flex;

    align-items:center;

    gap:10px;

    text-decoration:none;

    color:#a5a9ae;

    padding:11px;

    border-radius:8px;

    font-size:13px;

    transition:.2s ease;
}

.profile-menu a i{

    font-size:16px;
}


/* Hover */

.profile-menu a:hover{

    background:#22262a;

    color:#ff7a00;
}


/* Logout */

.profile-menu .profile-logout:hover{

    color:#ff6868;

    background:#2a1717;
}

    </style>

</head>


<body>


    <div class="login-container">


        <!-- LOGO -->

        <div class="login-logo">

            <h1>ClientFlow</h1>

            <p>Smart management. Better relationships.</p>

        </div>


        <!-- LOGIN CARD -->

        <div class="login-card">


            <!-- HEADING -->

            <div class="login-heading">

                <h2>Welcome back</h2>

                <p>Sign in to access your CRM dashboard.</p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label>Email Address</label>

                    <div class="input-wrapper">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="admin@ClientFlow.com"
                            autocomplete="email"
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label>Password</label>

                    <div class="input-wrapper">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Admin@123"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                        >

                            <i class="bi bi-eye" id="passwordIcon"></i>

                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>


                    <a href="#" class="forgot-link">
                        Forgot password?
                    </a>

                </div>


                <!-- ERROR -->

                <div
                    class="login-message"
                    id="loginMessage"
                ></div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="signin-btn"
                >

                    <i class="bi bi-box-arrow-in-right"></i>

                    Sign In

                </button>


            </form>


            <!-- DEMO LOGIN -->

            <!-- <div class="demo-info">

                Demo Login<br>

                <strong>admin@ClientFlow.com</strong>
                <br>

                <strong>Admin@123</strong>

            </div> -->


        </div>


        <!-- FOOTER -->

        <div class="login-footer">

            © 2026 ClientFlow · Secure CRM Portal

        </div>


    </div>


    <script>


        /* =========================
           DEMO CREDENTIALS
        ========================= */

        const demoEmail = "admin@ClientFlow.com";

        const demoPassword = "Admin@123";


        /* =========================
           PASSWORD VISIBILITY
        ========================= */

        function togglePassword(){

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("passwordIcon");


            if(password.type === "password"){

                password.type = "text";

                icon.classList.remove("bi-eye");

                icon.classList.add("bi-eye-slash");

            }

            else{

                password.type = "password";

                icon.classList.remove("bi-eye-slash");

                icon.classList.add("bi-eye");

            }

        }


        /* =========================
           LOGIN
        ========================= */

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event){

                event.preventDefault();


                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("loginMessage");


                /* Clear previous message */

                message.classList.remove("show");

                message.textContent = "";


                /* Empty fields */

                if(email === "" || password === ""){

                    showLoginError(
                        "Please enter your email and password."
                    );

                    return;

                }


                /* Email validation */

                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if(!emailPattern.test(email)){

                    showLoginError(
                        "Please enter a valid email address."
                    );

                    return;

                }


                /* Credentials */

                if(
                    email !== demoEmail ||
                    password !== demoPassword
                ){

                    showLoginError(
                        "Invalid email or password. Please try again."
                    );

                    return;

                }


                /* =========================
                   SUCCESS
                ========================= */

                /*
                    Store login state temporarily.
                    This allows the CRM pages to know
                    that the user has signed in.
                */

                sessionStorage.setItem(
                    "ClientFlowLoggedIn",
                    "true"
                );


                sessionStorage.setItem(
                    "ClientFlowUser",
                    email
                );


                /* Go to dashboard */

                window.location.href =
                    "dashboard.html";

            });


        /* =========================
           ERROR FUNCTION
        ========================= */

        function showLoginError(text){

            const message =
                document.getElementById("loginMessage");

            message.textContent = "⚠ " + text;

            message.classList.add("show");

        }


    </script>


</body>

</html>
